<!-- =====================================================================
  WONJU MOUNTAIN RACE — 아임웹 코드 위젯용 임베드 (2027 카운트다운 단독)

  용도:
    기존 아임웹 페이지 디자인은 그대로 두고, 원하는 위치에
    "2027 대회까지 카운트다운" 배너만 추가하고 싶을 때 사용합니다.
    (메인 상단, 팝업, 대회 안내 페이지 등 어디든 가능)

  붙여넣는 곳:
    아임웹 관리자 → 디자인모드 → 위젯 추가 → "코드" 위젯 → 전체 붙여넣기

  대회 날짜 변경:
    아래 <script> 안 RACE_DATE_2027 값만 수정하면 됩니다.
===================================================================== -->

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<div id="wmr-cd-embed" class="wmr-cd-embed">

<style>
.wmr-cd-embed {
  --wmr-bg: #0b0f14;
  --wmr-line: rgba(255, 255, 255, 0.10);
  --wmr-text: #eef3f8;
  --wmr-text-dim: #9fb0c3;
  --wmr-accent: #ff5a1f;

  font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
    "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
  background:
    radial-gradient(700px 300px at 50% -20%, rgba(255, 90, 31, 0.18), transparent 65%),
    var(--wmr-bg);
  color: var(--wmr-text);
  border-radius: 18px;
  padding: clamp(32px, 5vw, 56px) 24px;
  text-align: center;
  line-height: 1.5;
  word-break: keep-all;
}
.wmr-cd-embed *, .wmr-cd-embed *::before, .wmr-cd-embed *::after {
  margin: 0; padding: 0; box-sizing: border-box;
}
.wmr-cd-embed .wmr-cd-eyebrow {
  font-size: 0.8rem; font-weight: 700; letter-spacing: 0.32em;
  color: var(--wmr-accent);
}
.wmr-cd-embed .wmr-cd-title {
  margin-top: 12px;
  font-size: clamp(1.4rem, 3.4vw, 2.1rem);
  font-weight: 900; letter-spacing: 0.02em;
  text-transform: uppercase;
  color: var(--wmr-text);
}
.wmr-cd-embed .wmr-countdown {
  display: flex; align-items: center; justify-content: center;
  gap: clamp(8px, 1.6vw, 18px);
  margin-top: 26px;
}
.wmr-cd-embed .wmr-cd-unit {
  min-width: clamp(64px, 9vw, 104px);
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--wmr-line);
  border-radius: 14px;
  padding: clamp(12px, 1.8vw, 20px) 8px;
}
.wmr-cd-embed .wmr-cd-unit strong {
  display: block;
  font-size: clamp(1.5rem, 3.6vw, 2.5rem);
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  color: var(--wmr-text);
}
.wmr-cd-embed .wmr-cd-unit span {
  font-size: 0.68rem; letter-spacing: 0.22em; color: var(--wmr-text-dim);
}
.wmr-cd-embed .wmr-cd-sep {
  font-size: clamp(1.1rem, 2.6vw, 1.8rem);
  color: var(--wmr-text-dim); font-weight: 300;
}
.wmr-cd-embed .wmr-cd-note {
  margin-top: 14px; font-size: 0.84rem; color: var(--wmr-text-dim);
}
@media (max-width: 480px) {
  .wmr-cd-embed .wmr-cd-sep { display: none; }
  .wmr-cd-embed .wmr-countdown {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  }
  .wmr-cd-embed .wmr-cd-unit { min-width: 0; }
}
</style>

<p class="wmr-cd-eyebrow">ROAD TO 2027</p>
<h2 class="wmr-cd-title">Wonju Mountain Race</h2>
<div class="wmr-countdown" aria-label="2027 대회 예정일까지 남은 시간">
  <div class="wmr-cd-unit"><strong data-wmr-cd="days">—</strong><span>DAYS</span></div>
  <div class="wmr-cd-sep">:</div>
  <div class="wmr-cd-unit"><strong data-wmr-cd="hours">—</strong><span>HOURS</span></div>
  <div class="wmr-cd-sep">:</div>
  <div class="wmr-cd-unit"><strong data-wmr-cd="mins">—</strong><span>MIN</span></div>
  <div class="wmr-cd-sep">:</div>
  <div class="wmr-cd-unit"><strong data-wmr-cd="secs">—</strong><span>SEC</span></div>
</div>
<p class="wmr-cd-note">2027년 6월 개최 예정 · 세부 일정은 확정 후 공지됩니다</p>

<script>
(function () {
  'use strict';
  var root = document.getElementById('wmr-cd-embed');
  if (!root || root.getAttribute('data-wmr-init') === '1') return;
  root.setAttribute('data-wmr-init', '1');

  /* 2027 대회 예정일 (KST) — 확정되면 이 값만 수정 */
  var RACE_DATE_2027 = new Date('2027-06-20T06:00:00+09:00');

  var cd = {
    days: root.querySelector('[data-wmr-cd="days"]'),
    hours: root.querySelector('[data-wmr-cd="hours"]'),
    mins: root.querySelector('[data-wmr-cd="mins"]'),
    secs: root.querySelector('[data-wmr-cd="secs"]')
  };
  function pad(n) { return String(n).padStart(2, '0'); }
  function tick() {
    var diff = RACE_DATE_2027.getTime() - Date.now();
    if (diff <= 0) {
      cd.days.textContent = '0';
      cd.hours.textContent = cd.mins.textContent = cd.secs.textContent = '00';
      return;
    }
    var s = Math.floor(diff / 1000);
    cd.days.textContent = String(Math.floor(s / 86400));
    cd.hours.textContent = pad(Math.floor((s % 86400) / 3600));
    cd.mins.textContent = pad(Math.floor((s % 3600) / 60));
    cd.secs.textContent = pad(s % 60);
  }
  tick();
  setInterval(tick, 1000);
})();
</script>

</div>
